name: heated_rivalry
channels:
  - conda-forge
dependencies:
  # These packages are required if you want your environment to show up in jupyterlab
  - python=3.11
  - ipywidgets
  - ipykernel
  # Commonly used packages
  - xarray
  - numpy
  - scipy
  - pandas
  - matplotlib
  - xrft
  - cartopy
  - glidertools
  - xhistogram
  - pip 
  - imageio 
  - scikit-learn
  - xgboost
  - pytorch
  - pip:
    - tensorflow-macos
    - tensorflow-metal
    - graphviz